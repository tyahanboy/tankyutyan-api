  <script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const observer = new MutationObserver(() => {
        const loginBtn = Array.from(document.querySelectorAll('button, a')).find(
          el => el.textContent.includes('Discordでログイン') || (el.href && el.href.includes('/api/auth/discord'))
        );

        if (loginBtn && !document.getElementById('turnstile-wrapper')) {
          const wrapper = document.createElement('div');
          wrapper.id = 'turnstile-wrapper';
          wrapper.style.margin = '16px 0';
          wrapper.style.display = 'flex';
          wrapper.style.justifyContent = 'center';

          const widget = document.createElement('div');
          widget.className = 'cf-turnstile';
          widget.setAttribute('data-sitekey', '0x4AAAAAAF15uOl7-kzQvwHU');
          widget.setAttribute('data-theme', 'dark');
          wrapper.appendChild(widget);

          loginBtn.parentNode.insertBefore(wrapper, loginBtn);

          if (window.turnstile && typeof window.turnstile.render === 'function') {
            try { window.turnstile.render(widget); } catch (e) {}
          }

          loginBtn.addEventListener('click', (e) => {
            e.preventDefault();
            e.stopPropagation();
            const token = window.turnstile ? window.turnstile.getResponse() : "";
            if (!token) {
              alert("人間チェック（Turnstile）を完了してください。");
              return;
            }
            window.location.href = "/api/auth/discord?token=" + encodeURIComponent(token);
          }, true);
        }
      });

      observer.observe(document.body, { childList: true, subtree: true });
    });
  </script>

<script>
(() => {
  const key = "tankyutyan_privacy_seen_v1";
  const gate = document.getElementById("privacy-gate");
  const close = document.getElementById("privacy-close");

  let seen = false;
  try {
    seen = localStorage.getItem(key) === "1";
  } catch {}

  if (!seen) gate.hidden = false;

  close.addEventListener("click", () => {
    try {
      localStorage.setItem(key, "1");
    } catch {}
    gate.hidden = true;
  });
})();
</script>

  <!-- TANKYU_PATCH_START -->
<script>
(function() {
  function cleanUI() {
    // 1. (時間計測は未実装) テキストの除去
    document.querySelectorAll('div, span, p').forEach(el => {
      if (el.children.length === 0 && el.textContent.includes('時間計測は未実装')) {
        el.textContent = el.textContent.replace(/\s*\([^)]*時間計測は未実装[^)]*\)/g, '');
      }
    });

    // 2. 最下部の空欄ボックス（開発モードの残骸枠）を非表示化
    document.querySelectorAll('div, section').forEach(el => {
      const text = el.innerText ? el.innerText.trim() : '';
      if (text.includes('開発モード') || text.includes('接続準備中')) {
        el.style.display = 'none';
      }
      // アイコンのみ残った空カード枠を非表示
      if (el.children.length === 1 && el.querySelector('svg') && text === '') {
        const parent = el.parentElement;
        if (parent && parent.children.length === 1 && parent.innerText.trim() === '') {
          parent.style.display = 'none';
        } else {
          el.style.display = 'none';
        }
      }
    });
  }

  async function loadActivitiesChart() {
    try {
      const res = await fetch('/api/activities');
      if (!res.ok) return;
      const data = await res.json();
      if (!data.ok || !Array.isArray(data.activities)) return;

      const activities = data.activities;
      const totalCount = activities.length;

      // 「まだ活動ログがないよ」が含まれる要素の全親枠を取得して置き換え
      const allDivs = Array.from(document.querySelectorAll('div'));
      const emptyTextNode = allDivs.find(d => d.children.length === 0 && d.textContent.includes('まだ活動ログがないよ'));
      
      let targetContainer = null;
      if (emptyTextNode) {
        // アイコンとテキストを含む親エリアを特定
        let parent = emptyTextNode.parentElement;
        while (parent && parent.parentElement && !parent.parentElement.innerText.includes('最近の活動')) {
          parent = parent.parentElement;
        }
        targetContainer = parent;
      } else {
        targetContainer = allDivs.find(d => d.innerText && d.innerText.includes('/log 累計記録'));
      }

      if (!targetContainer) return;

      // 日付別利用回数を集計
      const countsByDate = {};
      activities.forEach(act => {
        const d = act.created_at ? new Date(act.created_at).toLocaleDateString('ja-JP', { month: 'numeric', day: 'numeric' }) : '今日';
        countsByDate[d] = (countsByDate[d] || 0) + 1;
      });

      const dates = Object.keys(countsByDate).slice(-7);
      if (dates.length === 0) dates.push('今日');
      const maxCount = Math.max(...Object.values(countsByDate), 1);

      const barsHtml = dates.map(d => {
        const count = countsByDate[d] || 0;
        const heightPct = Math.max(15, Math.round((count / maxCount) * 100));
        return `
          <div style="display: flex; flex-direction: column; align-items: center; flex: 1; min-width: 0;">
            <span style="font-size: 0.75rem; color: #a5b4fc; margin-bottom: 4px; font-weight: 600;">${count}回</span>
            <div style="width: 100%; max-width: 28px; background: rgba(255, 255, 255, 0.06); height: 80px; border-radius: 6px; display: flex; align-items: flex-end; padding: 2px; box-sizing: border-box;">
              <div style="width: 100%; height: ${heightPct}%; background: linear-gradient(180deg, #818cf8 0%, #4f46e5 100%); border-radius: 4px;"></div>
            </div>
            <span style="font-size: 0.7rem; color: #9ca3af; margin-top: 6px;">${d}</span>
          </div>
        `;
      }).join('');

      // 中身を丸ごとグラフ領域へ置換（デフォルト表示文言とアイコンを削除）
      targetContainer.innerHTML = `
        <div style="width: 100%; padding: 12px 8px 4px 8px; box-sizing: border-box;">
          <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px;">
            <span style="font-size: 0.85rem; color: #9ca3af; font-weight: 500;">/log 累計記録</span>
            <span style="font-size: 1.2rem; font-weight: bold; color: #818cf8;">${totalCount} <span style="font-size: 0.75rem; font-weight: normal; color: #9ca3af;">回</span></span>
          </div>
          <div style="display: flex; justify-content: space-between; align-items: flex-end; gap: 8px; height: 110px;">
            ${barsHtml}
          </div>
        </div>
      `;
    } catch (e) {
      console.error("Activities chart error:", e);
    }
  }

  function init() {
    cleanUI();
    loadActivitiesChart();
    setInterval(cleanUI, 1000);
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', init);
  } else {
    init();
  }
})();
</script>
</body></html>
